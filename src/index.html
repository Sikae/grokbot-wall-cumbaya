<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grok Bot · Cumbayá</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root { --accent:#4F9CF9; --fg:#ececf1; --dim:#8a8f9a; --line:#2a2d35; --bg:#06070a; --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; --cream:#FAF7F0; }
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--mono);color:var(--fg)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  /* Daylight theme */
  .daylight #stage{background:var(--cream)}
  .daylight html,.daylight body{background:var(--cream)}
  /* Daylight overlay UI */
  #daylight-ui{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
  .daylight #daylight-ui{display:block}
  #daylight-title{position:absolute;top:28px;left:32px;font-size:clamp(14px,2vw,20px);font-weight:500;color:#888;letter-spacing:.02em}
  #daylight-wifi{position:absolute;top:22px;right:32px;color:#000;text-align:right;line-height:1.15}
  #daylight-wifi .wifi-label{display:block;font-size:clamp(12px,1.3vw,16px);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  #daylight-wifi .wifi-value{display:block;font-size:clamp(22px,2.6vw,36px);font-weight:800;letter-spacing:.01em}
  #daylight-wifi .wifi-pass{margin-top:10px}
  #daylight-idle{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:clamp(16px,2.5vw,24px);color:#aaa;letter-spacing:.04em;text-align:center;transition:opacity .4s}
  #daylight-welcome{position:fixed;left:0;right:0;top:54%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;opacity:0;transition:opacity .5s;pointer-events:none}
  #daylight-welcome.active{opacity:1}
  #daylight-welcome-label{font-size:clamp(28px,5vw,60px);font-weight:700;letter-spacing:.08em;margin-bottom:8px;color:#1a1a1a;text-shadow:0 0 18px #FAF7F0,0 0 6px #FAF7F0}
  #daylight-welcome-name{font-size:clamp(42px,8vw,120px);font-weight:800;letter-spacing:-.01em;text-align:center;padding:0 20px;line-height:1.1}
  #gl{display:block}
  button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 12px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
  button.danger:hover{border-color:#ff4d4d;color:#ff7b7b}
  input,select{font:inherit;color:var(--fg);background:#0b0d12;border:1px solid var(--line);padding:8px 10px;outline:none;font-size:13px}
  input:focus,select:focus{border-color:var(--accent)}
  /* desk console */
  #desk{position:fixed;inset:20px;background:rgba(6,7,10,.96);border:1px solid var(--accent);display:flex;flex-direction:column;font-size:13px;line-height:1.5;box-shadow:0 0 0 1px #000,0 40px 120px rgba(0,0,0,.85);z-index:10}
  .dk-head{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .dk-title{color:var(--accent);font-weight:600;letter-spacing:.08em}
  .dk-sub{color:var(--dim);margin-left:8px}
  .dk-spacer{flex:1}
  .dk-body{display:flex;flex:1;min-height:0}
  .dk-left{width:46%;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .dk-left input{margin:12px 14px;flex:none}
  #dk-list{overflow:auto;flex:1;padding:0 6px 12px}
  .g-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid transparent;cursor:pointer}
  .g-row:hover{background:#0f1218}
  .g-row.sel{border-color:var(--accent);background:#0f1420}
  .g-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-email{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.in{border-color:var(--accent);color:var(--accent)}
  .badge.code{color:#fff;border-color:#3a3f4a}
  .badge.bad{border-color:#ff4d4d;color:#ff7b7b}
  .d-mail{border:1px solid var(--line);padding:12px 16px;margin:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:#c9ccd4}
  .d-mail .p{color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .dk-right{flex:1;overflow:auto;padding:22px 26px}
  .dk-empty{color:var(--dim)}
  .d-name{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
  .d-meta{color:var(--dim);margin-bottom:18px}
  .d-code{border:1px solid var(--line);padding:16px 18px;margin:12px 0;display:flex;gap:22px;align-items:flex-start}
  .d-code img{image-rendering:pixelated;width:168px;height:168px;background:#fff;flex:none}
  .d-code .c{font-size:22px;font-weight:600;letter-spacing:.02em;color:#fff;word-break:break-all}
  .d-code .u{color:var(--dim);font-size:12px;word-break:break-all;margin:6px 0 12px}
  .d-code .p{color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:20px;line-height:1.7}
  kbd{border:1px solid var(--line);padding:0 5px;color:#fff}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20}
  .md-box{width:min(560px,92vw);background:#07080c;border:1px solid var(--accent);padding:22px 24px;font-size:13px;max-height:88vh;overflow:auto}
  .md-box h3{margin:0 0 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .field label{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .field input,.field select{width:100%;box-sizing:border-box}
  #toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#0b0d12;border:1px solid var(--accent);padding:10px 16px;font-size:13px;z-index:30;pointer-events:none}
  #err{position:fixed;top:0;left:0;right:0;background:#3a0b0b;color:#ffb3b3;padding:8px 14px;font-size:12px;z-index:40;white-space:pre-wrap}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<!-- Daylight theme overlay UI (projector view) -->
<div id="daylight-ui">
  <div id="daylight-title">Grok Bot · Cumbayá</div>
  <div id="daylight-wifi">
    <div>
      <span class="wifi-label" id="daylight-wifi-user-label">Wi-Fi</span>
      <span class="wifi-value">InvitadosTCC_5G</span>
    </div>
    <div class="wifi-pass">
      <span class="wifi-label" id="daylight-wifi-pass-label">Password</span>
      <span class="wifi-value">ClientesTcc24</span>
    </div>
  </div>
  <div id="daylight-idle">Waiting for you</div>
  <div id="daylight-welcome">
    <div id="daylight-welcome-label">WELCOME</div>
    <div id="daylight-welcome-name"></div>
  </div>
</div>

<div id="desk" hidden>
  <div class="dk-head">
    <span class="dk-title">▌ DESK CONSOLE</span><span class="dk-sub" id="dk-mode"></span>
    <span class="dk-spacer"></span>
    <button id="dk-manual">+ manual check-in</button>
    <button id="dk-export">export csv</button>
    <button id="dk-settings">settings</button>
    <button id="dk-close">close [esc]</button>
  </div>
  <div class="dk-body">
    <div class="dk-left">
      <input id="dk-q" placeholder="search name or email…" autocomplete="off" spellcheck="false">
      <div id="dk-list"></div>
    </div>
    <div class="dk-right" id="dk-detail"><div class="dk-empty">select a guest to see their credit code</div></div>
  </div>
</div>
<div id="modal" hidden><div class="md-box" id="md-box"></div></div>
<div id="toast" hidden></div>
<div id="err" hidden></div>

<script src="vendor/three.min.js" data-inline></script>
<script src="vendor/qrcode.min.js" data-inline></script>

async function lumaGet(path, q) {

  const r = await api(u);

let fullRefreshAt = 0;
async function syncLuma() {
  if (app.syncing || !app.eventId) return;
  app.syncing = true;
  try {
    const full = Date.now() - fullRefreshAt > 60_000;
    let cursor = null, pages = 0, stop = false;
    if (full) app.total = 0;
    do {
      const j = await lumaGet('/v1/events/guests/list', { event_id: app.eventId, approval_status: 'approved', pagination_limit: 100, sort_column: 'checked_in_at', sort_direction: 'desc nulls last', pagination_cursor: cursor });
      for (const e of j.entries || []) {
        const g = normGuest(e);
        app.guests.set(g.key, g);
        if (full) app.total++;
        if (g.checkedInAt) { await ensureAllocated(g, { celebrate: !app.initial }); }
        else if (!full) stop = true;
      }
      cursor = j.next_cursor; pages++;
      if (!j.has_more || stop || pages > 30) break;
    } while (cursor);
    if (full) fullRefreshAt = Date.now();
    app.lastSync = Date.now(); app.error = ''; app.initial = false; app.dirty = true;
  } catch (e) { app.error = e.message; }
  finally { app.syncing = false; }
}

    app.labels = s.labels || app.labels; app.poolTotals = s.pools || app.poolTotals;

      if (s.luma.event) { app.eventId = s.luma.event.id; app.eventName = s.luma.event.name || ''; }
      app.total = Math.max(s.luma.total || 0, app.feed.length); app.lastSync = s.luma.lastSync || app.lastSync; app.error = s.luma.error || '';
    }
    if (s.lastWebhookAt && s.lastWebhookAt !== app.lastWebhookAt) { app.lastWebhookAt = s.lastWebhookAt; if (app.mode === 'luma' && !app.initial) syncLuma(); }

// Track used shapes/colors for Cumbayá mode (cycle without repeating)
const usedShapes = new Set();
const usedColors = new Set();

function getNextUnusedShape() {
  const n = shapeN();
  if (usedShapes.size >= n) usedShapes.clear();
  for (let i = 0; i < n; i++) {
    const idx = (morph.cur + 1 + i) % n;
    if (!usedShapes.has(idx)) { usedShapes.add(idx); return idx; }
  }
  return (morph.cur + 1) % n;
}

function getNextUnusedColor() {
  if (DAYLIGHT) {
    if (usedColors.size >= DAYLIGHT_COLORS.length) usedColors.clear();
    for (let i = 0; i < DAYLIGHT_COLORS.length; i++) {
      const idx = (daylightColorIdx + 1 + i) % DAYLIGHT_COLORS.length;
      if (!usedColors.has(idx)) { usedColors.add(idx); return idx; }
    }
    return (daylightColorIdx + 1) % DAYLIGHT_COLORS.length;
  }
  if (usedColors.size >= CHROMA.length) usedColors.clear();
  for (let i = 0; i < CHROMA.length; i++) {
    const idx = (celebColor + 1 + i) % CHROMA.length;
    if (!usedColors.has(idx)) { usedColors.add(idx); return idx; }
  }
  return (celebColor + 1) % CHROMA.length;
}

function updateDaylightUI(t) {

async function settingsModal() {
  let evOpts = '';
  if (app.luma) { try { const evs = await listEvents(); evOpts = evs.map(ev => `<option value="${esc(ev.id)}"${ev.id === app.eventId ? ' selected' : ''}>${esc(ev.name)} — ${new Date(ev.start_at).toLocaleString()}</option>`).join(''); } catch (e) { evOpts = `<option value="">could not list events: ${esc(e.message)}</option>`; } }
  openModal(`<h3>Settings</h3><form id="sf">
    ${app.luma ? `<div class="field"><label>luma event</label><select name="eventId"><option value="">auto (nearest upcoming)</option>${evOpts}</select></div>` : `<div class="field"><label>luma</label><div class="dk-empty">no API key on the server → demo/manual mode. Put LUMA_API_KEY in .env and restart serve.mjs.</div></div>`}
    <div class="field"><label>credit pools</label><select name="poolMode"><option value="A-then-B"${app.config.poolMode === 'A-then-B' ? ' selected' : ''}>one code per guest · pool A first, then B</option><option value="B-then-A"${app.config.poolMode === 'B-then-A' ? ' selected' : ''}>one code per guest · pool B first, then A</option><option value="both"${app.config.poolMode === 'both' ? ' selected' : ''}>two codes per guest · one from each pool</option></select></div>
    <div class="field"><label>email delivery</label><div class="dk-empty">${!app.server ? 'needs serve.mjs' : !app.email || !app.email.enabled ? 'off — set RESEND_API_KEY (and EMAIL_FROM) in .env, then restart serve.mjs' : `Resend · from ${esc(app.email.from)}${app.email.dryRun ? ' · DRY RUN (nothing is sent)' : ''}${app.email.testTo ? ` · every guest email is redirected to ${esc(app.email.testTo)}` : ''}`}</div></div>
    ${app.server && app.email && app.email.enabled ? `<div class="field"><label>send a test email (fake code) to</label><div class="row" style="margin:0"><input id="sf-testto" type="email" placeholder="you@example.com" style="flex:1" autocomplete="off"><button type="button" id="sf-test">send test</button></div></div>` : ''}
    <div class="field"><label>poll interval (seconds)</label><input name="poll" type="number" min="2" max="60" value="${Math.round(app.config.pollMs / 1000)}"></div>
    <div class="field"><label>cell height px (text size, reloads)</label><input name="cell" type="number" min="12" max="40" value="${G.ch}"></div>
    <div class="row"><button class="primary" type="submit">save</button><button type="button" id="sf-cancel">cancel</button><span class="dk-spacer"></span><button type="button" class="danger" id="sf-reset">reset allocations</button></div>
    <div class="hint">pools: A = ${esc(app.labels.A)} (${app.poolTotals.A}) · B = ${esc(app.labels.B)} (${app.poolTotals.B}). state is ${app.persist ? 'stored on the server in data/state.json' : app.mode === 'demo' ? 'not saved (demo)' : 'stored in this browser only'}.</div></form>`);
  $('#sf-cancel').onclick = closeModal;
  const tb = $('#sf-test');
  if (tb) tb.onclick = async () => {
    const to = $('#sf-testto').value.trim(); if (!to) { toast('enter an address'); return; }
    tb.disabled = true; tb.textContent = 'sending…';
    try { const r = await api('/email/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ to }) }); const j = await r.json();
      toast(j.result ? (j.result.status === 'failed' ? `failed: ${j.result.error}` : j.result.status === 'dry' ? `dry run ok → ${to}` : `sent to ${to} (${j.result.id || 'ok'})`) : (j.message || 'error')); }
    catch (e) { toast('error: ' + e.message); }
    tb.disabled = false; tb.textContent = 'send test';
  };
  $('#sf-reset').onclick = async () => {
    if (!confirm('Reset ALL allocations? Guests will get new codes on next sync. (A backup is written server-side.)')) return;
    if (app.persist) await api('/reset', { method: 'POST' });
    app.alloc.clear(); app.feed.length = 0; celeb.queue.length = 0; celeb.active = null; app.initial = true; saveLocal(); closeModal(); toast('allocations reset'); app.dirty = true;
    if (app.mode === 'demo') { for (const g of app.guests.values()) g.checkedInAt = null; }
    if (app.mode === 'luma') { fullRefreshAt = 0; syncLuma(); }
  };
  $('#sf').onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target);
    const patch = { poolMode: String(fd.get('poolMode')), pollMs: clamp(Number(fd.get('poll')) || 5, 2, 60) * 1000 };
    if (app.luma) patch.eventId = String(fd.get('eventId') || '') || null;
    await pushConfig(patch);
    const cell = Number(fd.get('cell'));
    if (cell && cell !== G.ch) { const u = new URL(location.href); u.searchParams.set('cell', cell); location.href = u.toString(); return; }
    if (app.luma && patch.eventId !== app.eventId) { location.reload(); return; }
    closeModal(); toast('saved');
  };
}
let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }
function showErr(msg) { const el = $('#err'); el.textContent = msg; el.hidden = !msg; }

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) { if (e.key === 'Escape') { e.target.blur(); if (!modal.hidden) closeModal(); } return; }
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (!modal.hidden) closeModal(); else if (!desk.hidden) closeDesk(); }
  else if (k === 'd' && DESK) { e.preventDefault(); desk.hidden ? openDesk() : closeDesk(); }
  else if (k === 'm' && DESK) { e.preventDefault(); if (desk.hidden) openDesk(); manualModal(); }
  else if (k === 'f') { e.preventDefault(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === ' ' && app.mode === 'demo' && desk.hidden) { e.preventDefault(); demoCheckIn(); }
  else if (k === 'e' && e.shiftKey && DESK) exportCsv();
});
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutGrid, 150); });

// =====================================================================
//  BOOT
// =====================================================================
async function boot() {
  layoutGrid();
  
  // Initialize daylight mode
  if (DAYLIGHT) {
    document.documentElement.classList.add('daylight');
    bgMesh.visible = false;
    daylightBgMesh.visible = true;
    scene.children.filter(c => c.isLight).forEach(l => { l.visible = false; });
    bodyMesh.material = flatMat;
    pts.visible = false;
    // Set up daylight UI text
    $('#daylight-title').textContent = t('title');
    $('#daylight-wifi-user-label').textContent = t('wifiUser');
    $('#daylight-wifi-pass-label').textContent = t('wifiPass');
    $('#daylight-idle').textContent = t('idle');
    $('#daylight-welcome-label').textContent = t('welcome');
    // Idle body is production blue. Check-ins walk the rest of the brand palette.
    daylightColorIdx = 6;
    document.documentElement.style.setProperty('--accent', accent().main);
    flatMat.color.set(accent().hex);
  }
  
  frame();
  // served over http(s): keep retrying /health rather than falling back to demo on a network blip
  let h = null;
  for (let attempt = 0; ; attempt++) {
    try { const r = await api('/health', { cache: 'no-store' }); if (r.status === 401) { showErr('Wall is locked — open it with ?key=… in the URL.'); return; } h = await r.json(); break; }
    catch { if (location.protocol === 'file:' || params.has('demo') || attempt >= 60) break; app.error = 'connecting to server…'; await new Promise(r => setTimeout(r, 3000)); }
  }
  if (h) { app.server = !!h.ok; app.luma = !!h.luma; app.poolTotals = h.pools || app.poolTotals; app.email = h.email || null; app.serverPolls = !!h.serverPolls; app.headline = h.eventName || ''; app.error = ''; }
  else app.server = false;
  const demo = params.has('demo') || (!app.server && !params.has('manual')) || (app.server && !app.luma && !params.has('manual'));
  app.persist = app.server && !demo;
  if (app.persist) await syncState(); else if (!demo) loadLocal();
  for (const a of app.alloc.values()) if (!app.feed.includes(a)) app.feed.push(a);
  app.feed.sort((x, y) => new Date(y.checkedInAt || y.at) - new Date(x.checkedInAt || x.at));
  if (demo) {
    app.mode = 'demo'; seedDemo();
    const burstN = Number(params.get('burst') || 0);
    for (let i = 0; i < burstN; i++) setTimeout(demoCheckIn, 200 + i * 400);
    scheduleDemo();
  } else if (!app.luma) {
    app.mode = 'manual';
  } else {
    app.mode = 'luma';
    if (app.serverPolls) { await syncState(); if (DESK) { const loadGuests = async () => { try { for (const g of (await (await api('/guests')).json()).guests || []) app.guests.set(g.key, { ...g, source: 'luma' }); app.dirty = true; } catch {} }; loadGuests(); setInterval(loadGuests, 30000); } }
    else try {
      const ev = await resolveEvent(); app.eventId = ev.id; app.eventName = ev.name || ''; app.eventStart = ev.start_at;
      const gc = ev.guest_counts && ev.guest_counts.approved; if (gc) app.total = gc.guests || 0;
      await syncLuma();
      const tick = async () => { await syncLuma(); setTimeout(tick, app.config.pollMs); }; setTimeout(tick, app.config.pollMs);
    } catch (e) { app.error = e.message; showErr('Luma: ' + e.message + ' — press D → settings to pick an event, or add ?demo to the URL.'); }
  }
  app.initial = false;
  if (app.persist) setInterval(syncState, app.serverPolls ? 2000 : 4000);
  document.documentElement.style.setProperty('--accent', accent().main);
  app.dirty = true;
  if (params.has('style')) { setStyle(Number(params.get('style')) || 0, nowS(), 0.01); if (params.has('hold')) morph.hold = true; }
  if (params.has('color')) { colorIdx = clamp(Number(params.get('color')) || 0, 0, BRAND.length - 1); document.documentElement.style.setProperty('--accent', accent().main); }
  if (params.get('modal') === 'manual') { openDesk(); manualModal(); }
  if (params.get('modal') === 'settings') { openDesk(); settingsModal(); }
  if (params.has('desk')) { openDesk(); const first = guestRows()[0]; if (first) { selectedKey = first.key; renderDesk(); } }
}
boot().catch(e => showErr(String(e.stack || e)));
</script>
